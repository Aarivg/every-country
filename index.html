<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every Country</title>
<meta name="description" content="A world geography quiz: click any country on the map, then type its name. All 197 countries.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><h1>Every Country</h1><span>Click a country, then name it</span></div>
  </header>
  <div class="main">
    <div class="mapwrap" id="wrap">
      <svg id="map" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet" aria-label="World map">
        <g id="world"></g>
      </svg>
    </div>
    <aside class="ledger">
      <section>
        <h2>Map key</h2>
        <div class="legend">
          <div><i style="background:var(--land)"></i>Country in the quiz</div>
          <div><i style="background:var(--terr)"></i>Territory, not in the quiz</div>
        </div>
      </section>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="data/world.js"></script>
<script src="js/game.js"></script>
</body>
</html>
