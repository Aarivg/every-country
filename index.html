<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every Country</title>
<meta name="description" content="A world geography quiz: click any country on the map, then type its name. All 197 countries.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><h1>Every Country</h1><span>Click a country, then name it</span></div>
    <div class="stats">
      <div class="stat"><b id="sNamed">0<small> / 197</small></b><label>Named</label></div>
      <div class="stat"><b id="sRev">0</b><label>Revealed</label></div>
      <div class="stat"><b id="sMiss">0</b><label>Wrong guesses</label></div>
      <div class="stat"><b id="sTime">0:00</b><label>Time</label></div>
    </div>
  </header>
  <div class="main">
    <div class="mapwrap" id="wrap">
      <svg id="map" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet" aria-label="World map">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect class="hatch-bg" width="6" height="6"></rect>
            <line class="hatch-ln" x1="0" y1="0" x2="0" y2="6"></line>
          </pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div class="zoomctl">
        <button id="zIn" aria-label="Zoom in">+</button>
        <button id="zOut" aria-label="Zoom out">−</button>
        <button id="zReset" aria-label="Reset view" style="font-size:14px">⤢</button>
      </div>
      <div class="hint-strip">Scroll to zoom · drag to pan · tiny countries are dots</div>
      <div class="toast" id="toast" hidden></div>
      <div class="pop" id="pop" hidden role="dialog" aria-label="Name this country"></div>
    </div>
    <aside class="ledger">
      <section>
        <h2>Map key</h2>
        <div class="legend">
          <div><i style="background:var(--land)"></i>Not named yet</div>
          <div><i style="background:var(--eu)"></i>Named (colored by continent)</div>
          <div><svg width="14" height="10" style="border:1px solid var(--border);border-radius:2px"><rect width="14" height="10" fill="url(#hatch)"></rect></svg>Revealed</div>
          <div><i style="background:var(--terr)"></i>Territory, not in the quiz</div>
        </div>
      </section>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="data/world.js"></script>
<script src="js/game.js"></script>
</body>
</html>
